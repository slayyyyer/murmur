name: World cache and Pages

on:
  schedule:
    # GitHub cron is UTC. Offset from the top of the hour to avoid the busiest minute.
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Start the allowlisted relay
        env:
          PORT: 8080
        run: |
          node proxy/server.js > relay.log 2>&1 &
          echo $! > relay.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat relay.log
          exit 1

      - name: Build the hourly cache
        env:
          MURMUR_PROXY: http://127.0.0.1:8080
        run: node scripts/build-world-cache.js

      - name: Assemble the static site
        run: |
          mkdir -p dist/data
          cp index.html styles.css dist/
          cp -R src dist/src
          cp data/world-cache.json dist/data/
          touch dist/.nojekyll

      - name: Stop the relay
        if: always()
        run: |
          if [ -f relay.pid ]; then kill "$(cat relay.pid)" || true; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
