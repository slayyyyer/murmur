name: World cache and Pages

on:
  schedule:
    # GitHub cron is UTC. Offset from the top of the hour to avoid the busiest minute.
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Start the allowlisted relay
        env:
          PORT: 8080
        run: |
          node proxy/server.js > relay.log 2>&1 &
          echo $! > relay.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat relay.log
          exit 1

      - name: Build the hourly cache
        env:
          MURMUR_PROXY: http://127.0.0.1:8080
          NEWS_MODEL_API_KEY: ${{ secrets.NEWS_MODEL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NEWS_MODEL_BASE_URL: ${{ vars.NEWS_MODEL_BASE_URL }}
          NEWS_MODEL_NAME: ${{ vars.NEWS_MODEL_NAME }}
          NEWS_MODEL_PROVIDER: ${{ vars.NEWS_MODEL_PROVIDER }}
          PREVIOUS_CACHE_URL: https://slayyyyer.github.io/murmur/data/world-cache.json
          PREVIOUS_MOOD_INDEX_URL: https://slayyyyer.github.io/murmur/data/mood/index.json
        run: node scripts/build-world-cache.js

      - name: Assemble the static site
        run: |
          mkdir -p dist/data
          cp index.html styles.css dist/
          cp -R src dist/src
          cp data/world-cache.json dist/data/
          cp -R data/mood dist/data/mood
          touch dist/.nojekyll

      - name: Stop the relay
        if: always()
        run: |
          if [ -f relay.pid ]; then kill "$(cat relay.pid)" || true; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled triggers in public repositories after 60 days
  # without a commit. Once the last commit is 45 days old, push one empty commit
  # so the hourly schedule keeps running through quiet months.
  keepalive:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep the hourly schedule enabled
        run: |
          last_commit=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last_commit) / 86400 ))
          echo "Last commit is ${age_days} day(s) old."
          if [ "${age_days}" -lt 45 ]; then
            echo "Recent enough; no keepalive commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the hourly cache schedule active"
          git push origin "HEAD:${GITHUB_REF_NAME}"
